name: Deploy

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  id-token: write
  contents: read

concurrency: deploy

env:
  ECR_REPOSITORY: onpremsite
  CLOUD_URL: ${{ vars.CLOUD_URL }}
  SITE_DESIRED_COUNT: ${{ vars.SITE_DESIRED_COUNT }}
  SITE_ASSET_BASE_URL: ${{ vars.SITE_ASSET_BASE_URL }}
  SITE_OAUTH_ISSUER: ${{ vars.SITE_OAUTH_ISSUER }}
  SITE_ALARM_EMAIL: ${{ vars.SITE_ALARM_EMAIL }}
  SITE_IMAGE_TAG: ${{ github.ref_name }}

jobs:
  test:
    name: Pre-deploy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm ci && npm run build && npm test
        working-directory: deploy/cdk

  deploy:
    name: Push the image and update the service
    needs: test
    # ARM runner: arm64 builds natively, amd64 under emulation.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: deploy/cdk/package-lock.json

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sign in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build and push the image for both architectures
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          platforms: linux/arm64,linux/amd64
          provenance: false
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.ref_name }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

      - run: npm ci
        working-directory: deploy/cdk
      - run: npx cdk diff --all || true
        working-directory: deploy/cdk
      - run: npx cdk deploy --all --require-approval never
        working-directory: deploy/cdk
