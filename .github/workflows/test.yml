name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  cdk:
    name: CDK typecheck and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/cdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: deploy/cdk/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
